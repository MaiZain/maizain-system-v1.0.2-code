<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAI ZAIN — نظام التشغيل والتوزيع</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
.lng{position:fixed;bottom:14px;left:14px;z-index:40;border:1px solid #c9e1f1;background:#fff;color:#0057b8;font:700 13px/1 Arial,sans-serif;padding:9px 14px;border-radius:999px;box-shadow:0 2px 8px rgba(11,45,91,.15);cursor:pointer}@media print{.lng{display:none!important}}
.olink{font-size:13px}.olink a{word-break:break-all}
.pos{color:var(--ok)}.stat b span.pos{font-size:inherit;display:inline;margin:0;color:var(--ok)}.plc .pln{font-size:40px;font-weight:800;margin:4px 0 10px;line-height:1.2}.plc .pln small{display:block;font-size:13px;color:var(--mute);font-weight:700}.chg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.chn h3{margin:0 0 8px;color:var(--pri)}.chn table{min-width:0}
.vant table{min-width:0}.vant th,.vant td{padding:6px 4px}.rto{padding-inline-start:22px;margin:6px 0 12px}.rto li{margin:3px 0}
#wban{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:30;width:min(680px,calc(100% - 24px));background:#fff;border:3px solid var(--bad);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;animation:wbp 1s ease-in-out infinite alternate}#wban .wbi{flex:1;min-width:220px}#wban .wba{display:flex;gap:8px}#wban .wba .btn{padding:10px 14px}#wban .wbm{font-size:12px;color:var(--mute)}#wban.mute .wbm{color:var(--bad);font-weight:700}@keyframes wbp{from{border-color:var(--bad)}to{border-color:#ff8a80}}body.wbon .toast{bottom:calc(190px + env(safe-area-inset-bottom,0px))}body.wbon main{padding-bottom:200px}
.pbar .btn{min-width:72px}.al.blk{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#ldov{position:fixed;inset:0;background:rgba(6,24,52,.78);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}#ldov.on{display:flex}.ldb{background:#0b2d5b;color:#fff;padding:24px 28px;border-radius:16px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);max-width:320px;font-weight:700}.lds{width:48px;height:48px;border:5px solid rgba(255,255,255,.22);border-top-color:#00aeef;border-radius:50%;margin:0 auto 14px;animation:ldr .9s linear infinite}@keyframes ldr{to{transform:rotate(360deg)}}
.net{font-size:12px;font-weight:700;border-radius:12px;padding:2px 10px;display:none}.net.busy{display:inline-block;color:var(--mute);background:var(--bg)}.net.off{display:inline-block;color:#fff;background:var(--bad)}
.wcard{border:1px solid var(--pri)}.wcard td small{color:var(--mute)}
.neg{color:var(--bad)}.stat b span.neg{font-size:inherit;color:var(--bad);display:inline;margin:0}.bch{width:100%;min-width:520px;height:auto;display:block}.bch .cg{stroke:var(--line);stroke-width:1}.bch .cz{stroke:var(--mute);stroke-width:1.2}.bch .ct{fill:var(--mute);font-size:11px;font-variant-numeric:tabular-nums}.bch .cl{fill:none;stroke:var(--pri);stroke-width:2;stroke-linejoin:round}.bch .ca{fill:var(--pri);opacity:.08}.bch .cd{fill:var(--pri);stroke:var(--card);stroke-width:2}.bch .cn{fill:var(--bad);stroke:var(--card);stroke-width:2}.bch .cp:hover circle+circle{r:6}
.asub{flex-wrap:wrap;gap:6px}.asub .btn{padding:7px 12px}.arng label{display:flex;align-items:center;gap:6px}.arng input{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}tr.tot td{font-weight:700;border-top:2px solid var(--line)}tr.jf td{border-top:2px solid var(--line)}.jeh,.jel{display:grid;grid-template-columns:minmax(0,2.6fr) minmax(70px,1fr) minmax(70px,1fr) 40px;gap:6px;margin-bottom:6px;align-items:center}.jeh{font-size:12px;color:var(--mute)}.jel select,.jel input{width:100%;min-width:0}
.bkb{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.oln,.olh{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(58px,.7fr) minmax(72px,.9fr) 40px;gap:6px;margin-bottom:6px;align-items:center}.olh{font-size:12px;color:#4a6283;margin:8px 0 4px}.oln select,.oln input{width:100%;min-width:0;box-sizing:border-box}.oln .btn{padding:6px 0}.otot{margin:12px 0;font-size:16px}.otot b{font-size:20px}.rc.wide{width:720px;max-width:100%}
.tag.x{background:#eceff1;color:#455a64}.rt{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.rt a{text-decoration:none}.rtc{border:1px solid var(--line,#c9e1f1);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fff}.rtc h4{margin:0 0 4px}.rtg{margin:14px 0 6px;color:#0057b8;font-weight:800}
:root{color-scheme:light;--bg:#eaf7ff;--card:#fff;--ink:#0b2d5b;--mute:#4a6283;--line:#c9e1f1;--pri:#0057b8;--onpri:#fff;--acc:#00aeef;--warn:#b25e00;--bad:#b3261e;--ok:#3f7d14;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.6 "IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
header:after{content:"";display:block;height:4px;background:linear-gradient(90deg,#0057b8,#00aeef,#8cc63f)}
header{background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{height:62px;width:auto;border-radius:8px;background:#fff;padding:1px;display:block}
.top h1{margin:0;font-size:20px;font-weight:800;flex:1;font-family:Montserrat,"Noto Kufi Arabic",sans-serif;letter-spacing:.02em;color:var(--ink)}
.top h1 small{display:block;font-size:12px;font-weight:500;color:var(--mute)}
.top select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px}
nav button{border:0;background:none;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:700;color:var(--mute);white-space:nowrap}
nav button.on{background:var(--pri);color:var(--onpri)}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{font-size:18px;margin:0 0 10px;font-family:"Noto Kufi Arabic","IBM Plex Sans Arabic",sans-serif;font-weight:800}
.tag.k1{color:var(--ok)}.tag.k2{color:var(--mute)}.tag.k3{color:var(--acc)}.tag.k4{color:var(--pri)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 16px}.kv div{font-size:13px;color:var(--mute)}.kv b{display:block;font-size:15px;color:var(--ink);font-weight:700}
.sr{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.sr input,.sr select{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}.sr input{flex:1;min-width:200px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px;font-weight:800}
.stat span{color:var(--mute);font-size:13px}
.stat.big b{color:var(--pri)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:8px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mute);font-weight:700;font-size:13px}
.btn{border:1px solid var(--line);background:var(--bg);padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:700}
.btn.p{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.btn.d{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:13px;font-weight:700;background:var(--bg)}
.tag.d{color:var(--ok)}.tag.f,.tag.x{color:var(--bad)}.tag.r{color:var(--acc)}.tag.n,.tag.c{color:var(--warn)}
.al{padding:8px 10px;border-radius:8px;margin-bottom:6px;background:var(--bg);border-inline-start:4px solid var(--warn)}
.al.b{border-color:var(--bad)}.al.g{border-color:var(--ok)}
.empty{color:var(--mute);padding:14px 0;text-align:center}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bar h2{flex:1;margin:0}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.mask.on{display:flex}
.rc{background:var(--card);border-radius:14px;padding:18px;width:360px;max-width:100%;max-height:90%;overflow:auto}
.rc h3{margin:0 0 10px}
.fl{display:block;margin-bottom:10px;font-size:14px;color:var(--mute)}
.fl input,.fl select,.fl textarea{display:block;width:100%;margin-top:3px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.acts{display:flex;gap:8px}
.acts .btn{flex:1;padding:10px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;display:none;z-index:10;max-width:90%;text-align:center}
@media print{header,.noprint,.mask,.toast{display:none!important}body{background:#fff}main{padding:0;max-width:none}.doc{border:0}}
.cfr{display:grid;grid-template-columns:90px 1fr 190px;gap:8px;align-items:center;margin:5px 0;font-size:13px}.cfb i{display:block;height:9px;border-radius:5px;margin:2px 0}.cfb .r{background:#8cc63f}.cfb .e{background:var(--warn)}.sel{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
@media(max-width:600px){.cfr{grid-template-columns:70px 1fr}.cfr span:last-child{grid-column:1/-1}}
.gate{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}.gate.on{display:flex}.gc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;width:380px;max-width:100%}.gc h2{margin:6px 0 12px}.who{font-size:13px;color:var(--mute)}
.note{color:var(--mute);font-size:13px;margin:6px 0 0}
@media(max-width:600px){header .top{padding:8px 12px;gap:8px}header .logo{height:36px}header h1{font-size:15px!important;line-height:1.25}header h1 small{font-size:11px}header .who{font-size:11px;max-width:34vw;line-height:1.3}header #lo{padding:6px 10px;font-size:13px}header nav{padding:0 8px 6px}main{padding-bottom:76px!important}#lng.lng{bottom:10px;left:10px;padding:7px 11px;font-size:12px}#rc .olh{display:none}#rc .oln{grid-template-columns:1fr 1fr 44px;border:1px solid #c9e1f1;border-radius:10px;padding:8px;margin-bottom:8px}#rc .oln .ol_p{grid-column:1/-1}.mask .rc{max-height:calc(100% - 24px)}}
@media(min-width:601px) and (max-width:1024px){main{padding-bottom:64px!important}}
</style>
</head>

quired for the system admin to receive reports and recover the account.", "لا تملك صلاحية كتابة المستخدمين في قاعدة البيانات (يلزم مستوى Editor في مشاركة الصفحة)": "You do not have permission to write users to the database (Editor access to the shared page is required)", "الأخضر مقبوضات، والبرتقالي مدفوعات (مصروفات تشغيلية ومشتريات مخزون). المدفوعات التشغيلية": "Green is receipts, orange is payments (operating expenses and stock purchases). Operating payments", "هذا لا يثبت أنه لم تحدث عمليات في ذلك اليوم؛ فقد تكون جرت خارج النظام أو لم تُسجَّل بعد.": "This does not prove that no operations took place that day; they may have happened outside the system or not been recorded yet.", "سجلات هذا النظام المخزنة محليًا في هذا المتصفح؛ لا يتضمن التقرير أي عملية لم تُسجَّل فيه.": "Records of this system stored locally in this browser; the report does not include any operation not recorded in it.", "سجّل الدخول بها وراجع مدير النظام لاستبدالها بكلمة مرور خاصة بك. لا تشارك هذه الرسالة مع أحد.": "Sign in with it and ask the system admin to replace it with your own password. Do not share this message with anyone.", "التاريخ المختار ليس اليوم: الأرقام هنا تعكس حالة النظام الآن ولا يمكن اعتبارها رصيد ذلك التاريخ.": "The selected date is not today: the figures here reflect the system status now and cannot be taken as the balance for that date.", "لقطة حالية وقت إنشاء التقرير وليست رصيدًا تاريخيًا مؤكدًا لهذا اليوم؛ الرصيد التاريخي غير محفوظ في النظام.": "Current snapshot at report time, not a confirmed historical balance for this day; historical balances are not stored in the system.", "أمانات تأمين العبوات بند مستقل: لا تدخل في المبيعات أو المقبوضات أو المصروفات أو الضريبة أو نقد صندوق اليوم.": "Bottle security deposits are a separate item: they are not included in sales, receipts, expenses, VAT or the day's cash box.", "سلّمها للموظف مباشرة. لا تُعرض مرة أخرى ولا تُحفظ في النظام نصًا. يُنصح بتغييرها عبر مدير النظام عند أول فرصة.": "Hand it to the employee directly. It will not be shown again and is not stored as text. It is recommended to change it via the system admin at the first opportunity.", "★ البند الأكثر استهلاكًا للميزانية. مشتريات المخزون تُحمَّل على التكلفة عند البيع ولا تدخل في ربحية الفترة مرتين.": "★ The item that consumes the most budget. Stock purchases are charged to cost on sale and are not counted twice in the period's profit.", "لا يوجد حذف أو تعديل لسجل التدقيق من الواجهة، لكن الصلاحية التقنية لكتابته مفتوحة لمن يملك وصول المساهمة في الصفحة.": "Audit log entries cannot be deleted or edited from the interface, but the technical permission to write it is open to anyone with contributor access to the page.", "رصيد المخزون في نهاية اليوم، وأي عملية خارج النظام، وسبب أي فرق نقدي ما لم يُسجَّل في إقفال اليوم أو ملاحظات المدير.": "End-of-day stock balance, any operation outside the system, and the reason for any cash difference unless recorded in the day close or manager notes.", "النظام لا يرسل البريد بنفسه. الزر أدناه ينشئ مسودة في برنامج البريد لديك، وإن لم يفتح فانسخ النص أعلاه وأرسله يدويًا.": "The system does not send email itself. The button below creates a draft in your email app; if it does not open, copy the text above and send it manually.", "لا توجد أرقام معروضة قبل إدخال بيانات فعلية. ابدأ بإضافة العملاء واستلام أول شحنة، أو حمّل بيانات تجريبية لتجربة الدورة كاملة.": "No figures are shown before real data is entered. Start by adding customers and receiving the first shipment, or load demo data to try the full cycle.", "بصفتك مالك الصفحة يمكنك تعيين كلمة مرور جديدة لأي حساب مباشرة. يتم التحقق من هويتك عبر حسابك في Claude لا عبر كلمة مرور النظام.": "As the page owner you can set a new password for any account directly. Your identity is verified through your Claude account, not the system password.", "التصنيف تلقائي: جديد (أُضيف خلال 30 يومًا ولم يستلم بعد)، نشط (استلم خلال 30 يومًا)، غير نشط (غير ذلك)، وعميل جملة حسب نوع العميل.": "Automatic classification: New (added within 30 days and no delivery yet), Active (delivered within 30 days), Inactive (otherwise), and Wholesale by customer type.", "تُضاف إيداعات السندات إلى هذا البند وتُخصم منه الاستردادات، ولا تدخل في المبيعات أو المقبوضات أو المدفوعات أو صافي التدفق النقدي أو الضريبة.": "Voucher deposits are added to this item and refunds are deducted from it; they are not included in sales, receipts, payments, net cash flow or VAT.", "الاعتمادات (خصم كبير، سعر أقل من التكلفة، تجاوز ائتمان، شطب، فرق صندوق) يملكها المدير العام ومدير النظام. مندوب التوزيع يرى الطلبات المسندة إليه فقط.": "Approvals (large discount, price below cost, credit overrun, write-off, cash difference) belong to the General Manager and System Admin. A driver sees only the orders assigned to them.", "دورة التنفيذ: طلب (تصدر الفاتورة تلقائيًا) ← تسليم مع تسجيل التحصيل. المخزون المتاح يُحجز عند الطلب ويُخصم عند التسليم، والطلب الآجل يُسجَّل رصيدًا على العميل عند التسليم.": "Workflow: order (invoice is issued automatically) → delivery with collection recorded. Available stock is reserved on order and deducted on delivery; a credit order is posted to the customer's balance on delivery.", "التحصيلات تُنسب إلى تاريخ تسجيل الدفعة، أما «المدفوع على طلبات اليوم» فيُنسب إلى تاريخ إنشاء الطلب وقد يشمل دفعات مؤرخة بعد هذا اليوم؛ فالرقمان غير متطابقين بالضرورة ولا يُجمعان.": "Collections are dated by the payment date, while «paid on today's orders» is dated by the order creation date and may include payments dated after this day; the two figures do not necessarily match and should not be added together.", "في الوضع المحلي لا يوجد تحقق من الهوية، وحسابات هذا المتصفح لا تُشارك مع غيره. يمكنك إعادة إعداد حسابات هذا المتصفح من جديد (لا تُحذف الطلبات والفواتير). اكتب كلمة «إعادة» للتأكيد.": "In local mode there is no identity verification, and this browser's accounts are not shared. You can reset this browser's accounts (orders and invoices are not deleted). Type the word «إعادة» to confirm.", "أدخل اسم المستخدم والبريد الإلكتروني المسجّل لحسابك. إذا تطابقا يصل طلب الاستعادة إلى مدير النظام، فيرسل لك كلمة مرور مؤقتة إلى بريدك المسجّل. لا يكشف النظام ما إذا كان الحساب موجودًا.": "Enter the username and the email registered to your account. If they match, the recovery request reaches the system admin, who will send a temporary password to your registered email. The system does not reveal whether the account exists.", "تُحسب تلقائيًا من الطلبات المسلّمة وفواتيرها ومن المصروفات واستلامات المخزون. أسعار البيع شاملة 5%، وتكلفة المشتريات المُدخلة قبل الضريبة. هذه أرقام تشغيلية للمتابعة وليست إقرارًا ضريبيًا، وتُراجع مع مختص قبل التقديم.": "Calculated automatically from delivered orders and their invoices, expenses and stock receipts. Selling prices include 5%, and purchase costs are entered before VAT. These are operational figures for monitoring, not a tax return, and should be reviewed by a specialist before filing.", "بيانات التشغيل (العملاء والطلبات والفواتير والمخزون والمالية) ما زالت محفوظة في متصفح كل مستخدم ولا تُشارك بعد. تسجيل الدخول والصلاحيات هنا يضبطان واجهة النظام فقط، ولا يمنعان شخصًا تقنيًا لديه وصول للصفحة من الاطلاع على البيانات أو تعديلها مباشرة.": "Operational data (customers, orders, invoices, inventory and finance) is still stored in each user's browser and is not shared yet. Login and permissions here control the system interface only, and do not stop a technical person with access to the page from viewing or editing the data directly.", "قيمة المخزون = تكلفة شراء الوحدة × الكمية المتاحة. تُحدَّث تكلفة الأصناف الجديدة بالمتوسط المرجّح عند كل استلام، وتُحتسب عبوة 18.9 لتر بآخر تكلفة استلام. الأصناف الجديدة تُدار هنا (استلام وتكلفة وقيمة)، أما البيع عبر الطلبات فما زال لعبوة 18.9 لتر.": "Stock value = unit purchase cost × available quantity. The cost of new items is updated by weighted average on every receipt, and the 18.9 L bottle uses the latest receipt cost. New items are managed here (receipt, cost and value), while sales through orders are still for the 18.9 L bottle only.", "بيانات التشغيل (العملاء والطلبات والفواتير والمخزون والمالية) محفوظة في Google Sheets ويراها كل المستخدمين. الدخول مقصور على حسابات الشركة، والصلاحيات تضبط واجهة النظام، وكل حفظ مسجّل باسم حساب Google الذي نفّذه.": "Operational data (customers, orders, invoices, inventory and finance) is stored in Google Sheets and shared by all users. Access is limited to company accounts, permissions control the system interface, and every save is logged with the Google account that made it.", "سجلات هذا النظام المحفوظة في قاعدة بياناته؛ لا يتضمن التقرير أي عملية لم تُسجَّل فيه.": "Records stored in this system's database; the report does not include any operation not recorded in it.", "سجل التدقيق يُضاف إليه فقط على الخادم، ولا يمكن تعديله أو حذفه من النظام.": "The audit log is append-only on the server and cannot be edited or deleted from the system.", "يتم التحقق من هويتك عبر حساب Google الذي نشر النظام، لا عبر كلمة مرور النظام.": "Your identity is verified through the Google account that published the system, not the system password.", "تعذر الاتصال": "Connection failed", "إعادة المحاولة": "Retry", "تعذر تحميل البيانات من الخادم. تحقق من الاتصال ثم أعد تحميل الصفحة.": "Could not load data from the server. Check the connection, then reload the page.", "تعذر الاتصال بالخادم. أعد تحميل الصفحة.": "Could not connect to the server. Reload the page.", "عدّل موظف آخر البيانات في نفس اللحظة. تم تحميل أحدث نسخة؛ راجع آخر عملية وأعد تنفيذها إن لم تظهر.": "Another employee changed the data at the same moment. The latest version has been loaded; check your last action and repeat it if it is missing.", "تعذر الحفظ على الخادم. ستُعاد المحاولة تلقائيًا؛ لا تغلق الصفحة.": "Could not save to the server. It will retry automatically; do not close the page.", "مساري اليوم": "My route today", "كشف حساب": "Statement", "رصيد": "balance", "مطعم": "Restaurant", "مكتب": "Office", "عميل تجريبي": "Demo customer", "مياه شرب 18.9 لتر": "Drinking water 18.9 L", "تحصيل من الرصيد": "Collection from balance", "رقم الطلب أو اسم العميل أو رقمه...": "Order No., customer name or number...", "بحث بالاسم أو الهاتف أو المنطقة أو رقم العميل...": "Search by name, phone, area or customer No....", "رقم الفاتورة أو العميل أو الرقم الضريبي...": "Invoice No., customer or TRN...", "النسخ الاحتياطية والاسترجاع": "Backups and restore", "تُحفظ نسخة تلقائية يوميًا الساعة 2 فجرًا في Drive (آخر 90 نسخة)، ويُتحقق من سلامة كل نسخة بعد حفظها. الاسترجاع متاح لمالك النظام فقط (حساب Google الذي نشره)، ويحفظ النظام نسخة من الوضع الحالي قبل أي استرجاع، ولا يُمس سجل التدقيق.": "An automatic backup is saved daily at 2 AM in Drive (last 90 copies), and each copy is verified after saving. Restore is available to the system owner only (the Google account that published it); the system saves a copy of the current state before any restore, and the audit log is never touched.", "البيانات في هذا الوضع محفوظة في هذا المتصفح فقط؛ نزّل نسخة احتياطية بانتظام واحفظها خارج الجهاز.": "In this mode data is stored in this browser only; download a backup regularly and keep it off this device.", "نسخة احتياطية الآن": "Back up now", "عرض النسخ المحفوظة": "Show saved backups", "تنزيل نسخة على الجهاز": "Download a copy", "استرجاع من ملف": "Restore from file", "النسخة سليمة ويمكن قراءتها بالكامل.": "The backup is intact and fully readable.", "تاريخ النسخة": "Backup date", "الإصدار": "Version", "المستخدمون": "Users", "جارٍ حفظ نسخة احتياطية...": "Saving a backup...", "تم حفظ النسخة والتحقق منها:": "Backup saved and verified:", "تعذر حفظ النسخة": "Could not save the backup", "الحجم": "Size", "معاينة": "Preview", "استرجاع": "Restore", "لا توجد نسخ محفوظة بعد.": "No backups saved yet.", "تعذر عرض النسخ": "Could not list backups", "جارٍ فحص النسخة...": "Checking the backup...", "استرجاع هذه النسخة": "Restore this backup", "تعذر قراءة النسخة": "Could not read the backup", "سيحلّ محتوى هذه النسخة محل البيانات الحالية لكل المستخدمين. تُحفظ نسخة من الوضع الحالي تلقائيًا قبل الاسترجاع.": "This backup will replace the current data for all users. A copy of the current state is saved automatically before restoring.", "إبقاء المستخدمين الحاليين": "Keep current users", "استرجاع المستخدمين من النسخة أيضًا": "Also restore users from the backup", "اكتب كلمة «استرجاع» للتأكيد": "Type the word «استرجاع» to confirm", "جارٍ الاسترجاع...": "Restoring...", "تعذر الاسترجاع": "Could not restore", "تم الاسترجاع. حُفظت نسخة الوضع السابق:": "Restored. A copy of the previous state was saved:", "تنزيل نسخة احتياطية على الجهاز": "Backup downloaded to device", "تم تنزيل النسخة": "Backup downloaded", "الملف تالف أو ليس نسخة احتياطية صالحة": "The file is damaged or not a valid backup", "الملف لا يحتوي بيانات النظام": "The file does not contain system data", "استرجاع نسخة احتياطية من ملف:": "Backup restored from file:", "تم الاسترجاع. حُفظ الوضع السابق في هذا المتصفح": "Restored. The previous state was kept in this browser", "الاسترجاع متاح لمالك النظام فقط (حساب Google الذي نشره)": "Restore is available to the system owner only (the Google account that published it)", "النسخة لا تحتوي حسابات المستخدمين": "The backup does not contain user accounts", "الملف ليس من مجلد النسخ الاحتياطية": "The file is not in the backups folder", "فشل التحقق من النسخة الاحتياطية": "Backup verification failed", "تعديل الفاتورة": "Edit invoice", "تعديل الطلب #": "Edit order #", "وفاتورته": "and its invoice", "+ إضافة صنف": "+ Add item", "سعر الوحدة": "Unit price", "الإجمالي:": "Total:", "التعديل متاح قبل التسليم فقط، ويُحدِّث الفاتورة تلقائيًا ويُسجَّل في سجل التدقيق.": "Editing is available before delivery only; it updates the invoice automatically and is recorded in the audit log.", "اترك سعر الوحدة فارغًا لاستخدام سعر الصنف الافتراضي. تصدر الفاتورة تلقائيًا.": "Leave the unit price empty to use the item's default price. The invoice is issued automatically.", "لا يمكن تعديل الطلب أو فاتورته بعد التسليم": "The order and its invoice cannot be edited after delivery", "الطلب غير موجود": "Order not found", "اختر العميل": "Choose the customer", "أضف صنفًا واحدًا على الأقل": "Add at least one item", "اختر الصنف": "Choose the item", "أدخل كمية صحيحة لكل صنف": "Enter a valid quantity for each item", "حدّد سعر بيع": "Set the selling price of", "من «المخزون» أو أدخل السعر في الطلب": "in «Inventory» or enter the price in the order", "المتاح من": "Available stock of", "غير كافٍ للكمية المطلوبة": "is not enough for the requested quantity", "الإجمالي الجديد أقل من المدفوع على الفاتورة (": "The new total is less than the amount paid on the invoice (", "تعديل الطلب": "Edit order", "والفاتورة": "and invoice", "كمية الصنف": "Quantity of item", "المتاحة غير كافية": "available is not enough", "تحميل طلب #": "Load order #", "على المندوب:": "onto driver:", "عبر واتساب": "via WhatsApp", "ملف PDF جاهز. اختر طريقة الإرسال:": "The PDF is ready. Choose how to send it:", "مشاركة ملف PDF (اختر واتساب ثم العميل)": "Share PDF file (choose WhatsApp, then the customer)", "إرسال رابط ملف PDF في محادثة العميل مباشرة": "Send the PDF link in the customer's chat directly", "تنزيل الملف وفتح محادثة العميل (أرفقه يدويًا)": "Download the file and open the customer's chat (attach it manually)", "المشاركة ترسل الملف نفسه؛ اختر واتساب من قائمة المشاركة ثم محادثة العميل.": "Sharing sends the file itself; choose WhatsApp from the share menu, then the customer's chat.", "الرابط يفتح الملف لمن يملكه فقط، ويُحفظ في Drive داخل مجلد مستندات العملاء.": "Only people who have the link can open the file; it is saved in Drive in the customer documents folder.", "تمت المشاركة": "Shared", "مشاركة الملفات غير متاحة هنا؛ استخدم الطريقة الأخرى": "File sharing is not available here; use the other option", "جارٍ رفع الملف...": "Uploading the file...", "تعذر رفع الملف": "Could not upload the file", "الرابط جاهز": "Link ready", "اضغط لفتح محادثة العميل؛ الرسالة تحتوي رابط ملف PDF.": "Tap to open the customer's chat; the message contains the PDF link.", "فتح محادثة واتساب": "Open WhatsApp chat", "تم تنزيل الملف؛ أرفقه في المحادثة": "File downloaded; attach it in the chat", "مشاركة الروابط خارج الشركة محظورة et", "مهام تلقائية متوقفة:": "Stopped automatic jobs:", "شغّل الدالة setup من محرر Apps Script": "run the setup function from the Apps Script editor", "تحديث الجداول": "Sheets refresh", "النسخ الاحتياطي": "Backup", "المهام التلقائية تعمل (النسخ الاحتياطي، التقرير اليومي، تحديث الجداول)": "Automatic jobs are running (backup, daily report, sheets refresh)", "آخر 24 ساعة:": "Last 24 hours:", "تعذر الفحص": "Check failed", "مراجعة سجل الأعطال": "Error log reviewed", "أُرسل إلى": "Sent to", "لا يوجد بريد لمدير النظام أو المدير العام": "No email for the System Admin or General Manager", "الواجهة": "Interface", "الخادم:": "Server:", "تُحسب المبيعات عند التسليم وتوزَّع على الإمارات حسب إمارة العميل. المصروفات بلا ضريبة (الرواتب والرسوم الحكومية) لا تدخل البند 9. راجع الأرقام مع مستشارك الضريبي قبل تقديم الإقرار على بوابة EmaraTax.": "Sales are recognised on delivery and allocated to emirates by the customer's emirate. Expenses without VAT (salaries and government fees) are excluded from box 9. Review the figures with your tax adviser before filing on EmaraTax.", "الإقفال يحتاج صلاحية «إقفال اليوم» واعتماد المدير العام أو مدير النظام. فتح الإقفال لمدير النظام فقط ويُسجَّل في سجل التدقيق.": "Locking needs the Day close permission and approval by the General Manager or System Admin. Only the System Admin can reopen a period, and it is recorded in the audit log.", "بعد إقفال شهر لا يمكن تسجيل تحصيل أو مصروف أو قيد يدوي أو تحويل أو سداد بتاريخ داخله، فتبقى التقارير المقدَّمة ثابتة.": "After a month is locked, no collection, expense, manual entry, transfer or payment can be dated inside it, so submitted reports stay fixed.", "النقد يدخل الصندوق، والبطاقة والتحويل يدخلان البنك. إيداع نقد الصندوق في البنك يُسجَّل هنا ولا يُعد مصروفًا.": "Cash goes to the cash box; card and bank transfer go to the bank. Depositing cash into the bank is recorded here and is not an expense.", "كل فاتورة مسلّمة وتحصيل ومصروف ومشتريات وسند تأمين وفرق صندوق يُنشئ قيدًا مزدوجًا تلقائيًا. الإجمالي: مدين": " /* ── واتساب مع ملف PDF ── */
var WAP=null;
async function waPdf(name,html,bw,phone,text){
  const n=waNum(phone);if(!n){toast("رقم هاتف العميل غير صالح لواتساب");return}
  let blob;
  try{toast("جارٍ تجهيز ملف PDF...");blob=await makePdf(html,bw)}catch(e){toast("تعذر إنشاء PDF");return}
  const file=new File([blob],name,{type:"application/pdf"});
  let canF=false;try{canF=!!(navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
  WAP={file,blob,name,phone,n,text};
  const b2=window.PDFLINK
    ?`<button class="btn${canF?"":" p"}" style="width:100%;margin-bottom:8px" onclick="waShareLink()">إرسال رابط ملف PDF في محادثة العميل مباشرة</button>`
    :`<button class="btn${canF?"":" p"}" style="width:100%;margin-bottom:8px" onclick="waShareDl()">تنزيل الملف وفتح محادثة العميل (أرفقه يدويًا)</button>`;
  $("rc").innerHTML=`<h3>إرسال ${esc(name)} عبر واتساب</h3><p>ملف PDF جاهز. اختر طريقة الإرسال:</p>${canF?`<button class="btn p" style="width:100%;margin-bottom:8px" onclick="waShareFile()">مشاركة ملف PDF (اختر واتساب ثم العميل)</button>`:""}${b2}<p class="note">${canF?"المشاركة ترسل الملف نفسه؛ اختر واتساب من قائمة المشاركة ثم محادثة العميل. ":""}${window.PDFLINK?"الرابط يفتح الملف لمن يملكه فقط، ويُحفظ في Drive داخل مجلد مستندات العملاء.":""}</p><div class="acts"><button class="btn" onclick="cl()">إغلاق</button></div>`;
  $("mask").classList.add("on")
}
async function waShareFile(){
  if(!WAP)return;
  try{await navigator.share({files:[WAP.file],title:WAP.name,text:WAP.text});cl();toast("تمت المشاركة")}
  catch(e){if(e&&e.name=="AbortError")return;toast("مشاركة الملفات غير متاحة هنا؛ استخدم الطريقة الأخرى")}
}
async function waShareLink(){
  if(!WAP)return;toast("جارٍ رفع الملف...");
  let u;try{u=await PDFLINK.put(WAP.name,WAP.blob)}catch(e){toast((e&&e.message)||"تعذر رفع الملف");return}
  const href="https://wa.me/"+WAP.n+"?text="+encodeURIComponent(WAP.text+"\n\nPDF: "+u);
  L(`مشاركة ${WAP.name} عبر واتساب برابط`);
  $("rc").innerHTML=`<h3>الرابط جاهز</h3><p>اضغط لفتح محادثة العميل؛ الرسالة تحتوي رابط ملف PDF.</p><a id="wago" class="btn p" style="display:block;text-align:center;margin-bottom:8px" href="${esc(href)}" target="_blank" rel="noopener" onclick="setTimeout(cl,300)">فتح محادثة واتساب</a><div class="acts"><button class="btn" onclick="cl()">إغلاق</button></div>`
}
function waShareDl(){
  if(!WAP)return;const u=URL.createObjectURL(WAP.blob),a=document.createElement("a");a.href=u;a.download=WAP.name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),60000);cl();waSend(WAP.phone,WAP.text);toast("تم تنزيل الملف؛ أرفقه في المحادثة")
}

var stmM=td().slice(0,7);
function stPick(cid){
  dlg("كشف حساب شهري",[{k:"m",l:"الشهر",t:"month",v:stmM}],v=>{if(!/^\d{4}-\d{2}$/.test(v.m)){toast("اختر الشهر");return false}stmM=v.m;cur=cid;view="stm"})
}
function stData(c,ym){
  const E=[];
  st.o.filter(o=>o.cid==c.id&&o.s=="d").forEach(o=>{const v=st.iv.find(x=>x.oid==o.id);E.push({d:o.d,k:o.id*2,t:`${v?ino(v):"Order #"+o.id} — ${its(o).map(i=>i.q+" × "+pnEnI(i)+" @ "+f(i.pr)).join(", ")}`,db:o.t,cr:0})});
  st.p.filter(p=>p.cid==c.id).forEach(p=>E.push({d:p.d,k:p.o?p.o*2+1:1e9,t:`Payment ${rno(p.no)} — ${enx(ENM,p.m)}${p.inv?" — INV-"+pad(p.inv):p.o?" — Order #"+p.o:" — on account"}`,db:0,cr:p.a}));
  E.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.k-b.k);
  const st0=ym+"-01",open=sum(E.filter(x=>x.d<st0),x=>x.db-x.cr),M=E.filter(x=>x.d.slice(0,7)==ym);
  let run=open;M.forEach(x=>{run+=x.db-x.cr;x.bal=run});
  return{open,M,close:run,db:sum(M,x=>x.db),cr:sum(M,x=>x.cr)}
}
function stmtDoc(c,ym){
